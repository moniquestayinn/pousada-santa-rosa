<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário de Reservas - Pousada Santa Rosa</title>
<style>
  :root {
    --bg: #f5f1eb;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #6b6b6b;
    --border: #e5e0d6;
    --orange: #d97706;
    --orange-dark: #b45309;
    --green: #16a34a;
    --red: #dc2626;
    --blue: #2563eb;
    --yellow: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: var(--orange);
    color: #fff;
    padding: 16px 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  header h1 { font-size: 20px; font-weight: 700; }
  header p { font-size: 13px; opacity: 0.9; margin-top: 2px; }
  .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
    align-items: center;
  }
  .btn {
    background: var(--orange);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: var(--orange-dark); }
  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--card); }
  .btn-small { padding: 6px 10px; font-size: 12px; }
  .btn-danger { background: var(--red); }
  .btn-danger:hover { background: #b91c1c; }
  .btn-success { background: var(--green); }
  .btn-success:hover { background: #15803d; }
  .nav-month {
    display: flex; align-items: center; gap: 8px; margin-left: auto;
  }
  .nav-month button {
    background: var(--card);
    border: 1px solid var(--border);
    width: 32px; height: 32px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .nav-month span { font-weight: 600; min-width: 160px; text-align: center; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 12px;
    font-size: 12px; color: var(--muted);
    margin-bottom: 16px;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
  .grid {
    display: grid;
    grid-template-columns: 140px repeat(31, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    overflow-x: auto;
  }
  .cell {
    background: var(--card);
    padding: 4px;
    font-size: 11px;
    min-height: 36px;
    position: relative;
  }
  .cell-header {
    background: #faf7f2;
    font-weight: 600;
    text-align: center;
    font-size: 11px;
    padding: 6px 2px;
  }
  .cell-suite {
    background: #faf7f2;
    font-weight: 600;
    font-size: 12px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
  }
  .cell-empty { background: var(--card); }
  .cell-today { background: #fef3c7; }
  .cell-reserved {
    background: var(--orange);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 10px;
  }
  .cell-reserved:hover { background: var(--orange-dark); }
  .cell-reserved.first { border-radius: 4px 0 0 4px; }
  .cell-reserved.last { border-radius: 0 4px 4px 0; }
  .cell-reserved.single { border-radius: 4px; }
  .cell-reserved.channel-whatsapp { background: var(--green); }
  .cell-reserved.channel-booking { background: var(--blue); }
  .cell-reserved.channel-instagram { background: #db2777; }
  .cell-reserved.channel-outro { background: var(--yellow); color: #000; }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }
  .modal {
    background: var(--card);
    border-radius: 12px;
    padding: 24px;
    max-width: 500px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 18px; margin-bottom: 16px; }
  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--muted);
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions {
    display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;
  }
  .status-sync {
    font-size: 11px;
    color: var(--muted);
    margin-left: 8px;
  }
  .status-sync.ok { color: var(--green); }
  .status-sync.err { color: var(--red); }
  .loading {
    position: fixed;
    top: 12px; right: 12px;
    background: var(--orange);
    color: #fff;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    z-index: 100;
    display: none;
  }
  .loading.active { display: block; }
  @media (max-width: 768px) {
    .grid { grid-template-columns: 100px repeat(31, 30px); }
    .cell-suite { font-size: 10px; padding: 4px; }
  }
</style>
</head>
<body>

<header>
  <h1>🏨 Pousada Santa Rosa</h1>
  <p>Calendário de Reservas</p>
</header>

<div class="container">
  <div class="toolbar">
    <button class="btn" data-action="new">➕ Nova Reserva</button>
    <button class="btn btn-ghost" data-action="suites">🛏️ Suítes</button>
    <button class="btn btn-ghost" data-action="reload">🔄 Atualizar</button>
    <button class="btn btn-ghost" data-action="export">⬇️ Exportar</button>
    <button class="btn btn-ghost" data-action="import">️ Importar</button>
    <input type="file" id="fileImport" accept=".json" style="display:none">
    <div class="nav-month">
      <button data-action="prev">◀</button>
      <span id="monthLabel"></span>
      <button data-action="next">▶</button>
    </div>
    <span id="syncStatus" class="status-sync"></span>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>WhatsApp</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>Booking</div>
    <div class="legend-item"><div class="legend-dot" style="background:#db2777"></div>Instagram</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div>Outro</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fef3c7"></div>Hoje</div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="loading" id="loading">Sincronizando...</div>

<div id="modalRoot"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzSTfFXbuGupqh4ezXNt9rNzdUG-kw7ZpOV2b7nDEz3YY3gp4FmWi75-Y0GMreV7BW1/exec';
const USE_SHEETS = true;
const KEY = 'pousada_santa_rosa_data';

let reservas = [];
let suites = [];
let currentDate = new Date();
currentDate.setDate(1);

function setSyncStatus(msg, ok){
  const el = document.getElementById('syncStatus');
  el.textContent = msg;
  el.className = 'status-sync ' + (ok ? 'ok' : 'err');
}

function showLoading(active){
  document.getElementById('loading').classList.toggle('active', active);
}

function loadData(callback){
  if(!USE_SHEETS){
    try {
      var raw = localStorage.getItem(KEY);
      if(!raw) return callback ? callback(null) : null;
      var data = JSON.parse(raw);
      reservas = Array.isArray(data.reservas) ? data.reservas : [];
      suites = Array.isArray(data.suites) ? data.suites : [];
      if(callback) callback();
    } catch(e){ if(callback) callback(); }
    return;
  }
  showLoading(true);
  setSyncStatus('Carregando...', false);
  fetch(API_URL + '?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(data){
      showLoading(false);
      if(data && data.success){
        reservas = Array.isArray(data.reservas) ? data.reservas : [];
        suites = Array.isArray(data.suites) ? data.suites : [];
        if(suites.length === 0){
          suites = [
            { id: 's1', name: 'Suíte Mar', price: 350, capacity: 2, description: '' },
            { id: 's2', name: 'Suíte Jardim', price: 280, capacity: 2, description: '' }
          ];
          save();
        }
        setSyncStatus('✓ Sincronizado', true);
      } else {
        setSyncStatus('✗ Erro ao carregar', false);
      }
      if(callback) callback();
      render();
    })
    .catch(function(err){
      showLoading(false);
      setSyncStatus(' Sem conexão', false);
      console.error(err);
      if(callback) callback();
    });
}

function save(){
  if(!USE_SHEETS){
    localStorage.setItem(KEY, JSON.stringify({ reservas: reservas, suites: suites }));
    return;
  }
  showLoading(true);
  setSyncStatus('Salvando...', false);
  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'sync', reservas: reservas, suites: suites })
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    showLoading(false);
    if(data && data.success){
      setSyncStatus('✓ Salvo', true);
    } else {
      setSyncStatus('✗ Erro ao salvar', false);
    }
  })
  .catch(function(err){
    showLoading(false);
    setSyncStatus(' Erro de conexão', false);
    console.error(err);
  });
}

function uid(){ return 'r' + Date.now() + Math.floor(Math.random()*1000); }

function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }

function sameDay(a, b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function parseDate(s){
  if(!s) return null;
  var parts = s.split('-');
  if(parts.length !== 3) return null;
  return new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
}

function formatDate(d){
  if(!d) return '';
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}

function monthName(d){
  var names = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return names[d.getMonth()] + ' ' + d.getFullYear();
}

function reservationsForSuite(suiteId, year, month){
  var out = [];
  var lastDay = new Date(year, month+1, 0).getDate();
  reservas.forEach(function(r){
    if(r.suiteId !== suiteId) return;
    var ci = parseDate(r.checkIn);
    var co = parseDate(r.checkOut);
    if(!ci || !co) return;
    var start = new Date(year, month, 1);
    var end = new Date(year, month, lastDay);
    if(co < start || ci > end) return;
    out.push(r);
  });
  return out;
}

function render(){
  document.getElementById('monthLabel').textContent = monthName(currentDate);
  var year = currentDate.getFullYear();
  var month = currentDate.getMonth();
  var lastDay = daysInMonth(currentDate);
  var today = new Date();

  var grid = document.getElementById('grid');
  grid.innerHTML = '';

  // Header row
  var corner = document.createElement('div');
  corner.className = 'cell cell-header';
  corner.textContent = 'Suíte';
  grid.appendChild(corner);
  for(var d=1; d<=lastDay; d++){
    var h = document.createElement('div');
    h.className = 'cell cell-header';
    h.textContent = d;
    if(today.getFullYear()===year && today.getMonth()===month && today.getDate()===d){
      h.style.background = '#fef3c7';
    }
    grid.appendChild(h);
  }

  // Suite rows
  suites.forEach(function(suite){
    var label = document.createElement('div');
    label.className = 'cell cell-suite';
    label.textContent = suite.name;
    grid.appendChild(label);

    var resList = reservationsForSuite(suite.id, year, month);

    for(var d=1; d<=lastDay; d++){
      var cell = document.createElement('div');
      cell.className = 'cell';
      var cellDate = new Date(year, month, d);
      if(sameDay(cellDate, today)) cell.classList.add('cell-today');

      var res = null;
      resList.forEach(function(r){
        var ci = parseDate(r.checkIn);
        var co = parseDate(r.checkOut);
        if(cellDate >= ci && cellDate < co) res = r;
      });

      if(res){
        var ci = parseDate(res.checkIn);
        var co = parseDate(res.checkOut);
        cell.className = 'cell cell-reserved';
        cell.classList.add('channel-' + (res.channel || 'outro'));
        if(sameDay(cellDate, ci)) cell.classList.add('first');
        if(sameDay(cellDate, new Date(co.getTime() - 86400000))) cell.classList.add('last');
        if(ci.getTime() === co.getTime() - 86400000) cell.classList.add('single');
        cell.textContent = res.guestName ? res.guestName.split(' ')[0] : '';
        cell.dataset.resId = res.id;
        cell.addEventListener('click', function(){
          openEdit(this.dataset.resId);
        });
      } else {
        cell.className = 'cell cell-empty';
        cell.dataset.suiteId = suite.id;
        cell.dataset.date = formatDate(cellDate);
        cell.addEventListener('click', function(){
          openNew(this.dataset.suiteId, this.dataset.date);
        });
      }
      grid.appendChild(cell);
    }
  });
}

function openModal(html){
  document.getElementById('modalRoot').innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal">' + html + '</div></div>';
  document.getElementById('modalOverlay').addEventListener('click', function(e){
    if(e.target === this) closeModal();
  });
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

function openNew(suiteId, dateStr){
  var suiteOptions = suites.map(function(s){
    return '<option value="'+s.id+'" '+(s.id===suiteId?'selected':'')+'>'+s.name+'</option>';
  }).join('');

  var html = '<h2>Nova Reserva</h2>' +
    '<form id="resForm">' +
    '<div class="form-group"><label>Hóspede *</label><input name="guestName" required></div>' +
    '<div class="form-row">' +
      '<div class="form-group"><label>Check-in *</label><input type="date" name="checkIn" value="'+(dateStr||'')+'" required></div>' +
      '<div class="form-group"><label>Check-out *</label><input type="date" name="checkOut" required></div>' +
    '</div>' +
    '<div class="form-row">' +
      '<div class="form-group"><label>Suíte *</label><select name="suiteId" required>'+suiteOptions+'</select></div>' +
      '<div class="form-group"><label>Hóspedes</label><input type="number" name="guests" min="1" value="1"></div>' +
    '</div>' +
    '<div class="form-row">' +
      '<div class="form-group"><label>Nº Reserva</label><input name="reservationNumber"></div>' +
      '<div class="form-group"><label>Canal</label><select name="channel"><option value="whatsapp">WhatsApp</option><option value="booking">Booking</option><option value="instagram">Instagram</option><option value="outro">Outro</option></select></div>' +
    '</div>' +
    '<div class="form-group"><label>Valor Total (R$)</label><input type="number" name="total" step="0.01" min="0"></div>' +
    '<div class="form-group"><label>Observações</label><textarea name="notes"></textarea></div>' +
    '<div class="modal-actions">' +
      '<button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
      '<button type="submit" class="btn btn-success">Salvar</button>' +
    '</div></form>';
  openModal(html);

  document.getElementById('resForm').addEventListener('submit', function(e){
    e.preventDefault();
    var fd = new FormData(this);
    var res = {
      id: uid(),
      guestName: fd.get('guestName'),
      checkIn: fd.get('checkIn'),
      checkOut: fd.get('checkOut'),
      suiteId: fd.get('suiteId'),
      guests: parseInt(fd.get('guests')) || 1,
      reservationNumber: fd.get('reservationNumber') || '',
      channel: fd.get('channel') || 'outro',
      notes: fd.get('notes') || '',
      total: parseFloat(fd.get('total')) || 0,
      createdAt: new Date().toISOString()
    };
    reservas.push(res);
    save();
    closeModal();
    render();
  });
}

function openEdit(resId){
  var res = reservas.find(function(r){ return r.id === resId; });
  if(!res) return;

  var suiteOptions = suites.map(function(s){
    return '<option value="'+s.id+'" '+(s.id===res.suiteId?'selected':'')+'>'+s.name+'</option>';
  }).join('');

  var html = '<h2>Editar Reserva</h2>' +
    '<form id="resForm">' +
    '<div class="form-group"><label>Hóspede *</label><input name="guestName" value="'+(res.guestName||'')+'" required></div>' +
    '<div class="form-row">' +
      '<div class="form-group"><label>Check-in *</label><input type="date" name="checkIn" value="'+(res.checkIn||'')+'" required></div>' +
      '<div class="form-group"><label>Check-out *</label><input type="date" name="checkOut" value="'+(res.checkOut||'')+'" required></div>' +
    '</div>' +
    '<div class="form-row">' +
      '<div class="form-group"><label>Suíte *</label><select name="suiteId" required>'+suiteOptions+'</select></div>' +
      '<div class="form-group"><label>Hóspedes</label><input type="number" name="guests" min="1" value="'+(res.guests||1)+'"></div>' +
    '</div>' +
    '<div class="form-row">' +
      '<div class="form-group"><label>Nº Reserva</label><input name="reservationNumber" value="'+(res.reservationNumber||'')+'"></div>' +
      '<div class="form-group"><label>Canal</label><select name="channel"><option value="whatsapp" '+(res.channel==='whatsapp'?'selected':'')+'>WhatsApp</option><option value="booking" '+(res.channel==='booking'?'selected':'')+'>Booking</option><option value="instagram" '+(res.channel==='instagram'?'selected':'')+'>Instagram</option><option value="outro" '+(res.channel==='outro'?'selected':'')+'>Outro</option></select></div>' +
    '</div>' +
    '<div class="form-group"><label>Valor Total (R$)</label><input type="number" name="total" step="0.01" min="0" value="'+(res.total||0)+'"></div>' +
    '<div class="form-group"><label>Observações</label><textarea name="notes">'+(res.notes||'')+'</textarea></div>' +
    '<div class="modal-actions">' +
      '<button type="button" class="btn btn-danger" id="btnDelete">Excluir</button>' +
      '<button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
      '<button type="submit" class="btn btn-success">Salvar</button>' +
    '</div></form>';
  openModal(html);

  document.getElementById('btnDelete').addEventListener('click', function(){
    if(confirm('Excluir esta reserva?')){
      reservas = reservas.filter(function(r){ return r.id !== resId; });
      save();
      closeModal();
      render();
    }
  });

  document.getElementById('resForm').addEventListener('submit', function(e){
    e.preventDefault();
    var fd = new FormData(this);
    res.guestName = fd.get('guestName');
    res.checkIn = fd.get('checkIn');
    res.checkOut = fd.get('checkOut');
    res.suiteId = fd.get('suiteId');
    res.guests = parseInt(fd.get('guests')) || 1;
    res.reservationNumber = fd.get('reservationNumber') || '';
    res.channel = fd.get('channel') || 'outro';
    res.notes = fd.get('notes') || '';
    res.total = parseFloat(fd.get('total')) || 0;
    save();
    closeModal();
    render();
  });
}

function openSuites(){
  var rows = suites.map(function(s, i){
    return '<tr data-idx="'+i+'">' +
      '<td><input value="'+(s.name||'')+'" data-field="name" style="width:100%;padding:4px;border:1px solid var(--border);border-radius:4px"></td>' +
      '<td><input type="number" value="'+(s.price||0)+'" data-field="price" style="width:80px;padding:4px;border:1px solid var(--border);border-radius:4px"></td>' +
      '<td><input type="number" value="'+(s.capacity||'')+'" data-field="capacity" style="width:60px;padding:4px;border:1px solid var(--border);border-radius:4px"></td>' +
      '<td><button class="btn btn-danger btn-small" data-del="'+i+'"></button></td>' +
    '</tr>';
  }).join('');

  var html = '<h2>Gerenciar Suítes</h2>' +
    '<table style="width:100%;border-collapse:collapse;margin-bottom:12px">' +
    '<thead><tr><th style="text-align:left;padding:6px">Nome</th><th style="text-align:left;padding:6px">Preço</th><th style="text-align:left;padding:6px">Cap.</th><th></th></tr></thead>' +
    '<tbody id="suiteBody">'+rows+'</tbody></table>' +
    '<button class="btn btn-ghost btn-small" id="btnAddSuite">+ Adicionar Suíte</button>' +
    '<div class="modal-actions">' +
      '<button class="btn btn-ghost" onclick="closeModal()">Fechar</button>' +
      '<button class="btn btn-success" id="btnSaveSuites">Salvar Tudo</button>' +
    '</div>';
  openModal(html);

  document.getElementById('btnAddSuite').addEventListener('click', function(){
    suites.push({ id: 's'+Date.now(), name: 'Nova Suíte', price: 0, capacity: 2, description: '' });
    openSuites();
  });

  document.getElementById('btnSaveSuites').addEventListener('click', function(){
    var rows = document.querySelectorAll('#suiteBody tr');
    rows.forEach(function(tr, i){
      if(!suites[i]) return;
      tr.querySelectorAll('input').forEach(function(inp){
        var f = inp.dataset.field;
        if(f === 'price' || f === 'capacity') suites[i][f] = parseFloat(inp.value) || 0;
        else suites[i][f] = inp.value;
      });
    });
    save();
    closeModal();
    render();
  });

  document.querySelectorAll('[data-del]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var idx = parseInt(this.dataset.del);
      if(confirm('Excluir esta suíte?')){
        suites.splice(idx, 1);
        openSuites();
      }
    });
  });
}

document.addEventListener('click', function(e){
  var action = e.target.closest('[data-action]');
  if(!action) return;
  var a = action.dataset.action;
  if(a === 'new') openNew();
  else if(a === 'suites') openSuites();
  else if(a === 'reload'){ loadData(function(){ render(); }); }
  else if(a === 'prev'){ currentDate.setMonth(currentDate.getMonth()-1); render(); }
  else if(a === 'next'){ currentDate.setMonth(currentDate.getMonth()+1); render(); }
  else if(a === 'export'){
    var data = JSON.stringify({ reservas: reservas, suites: suites }, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = 'reservas_' + formatDate(new Date()) + '.json';
    link.click();
    URL.revokeObjectURL(url);
  }
  else if(a === 'import'){
    document.getElementById('fileImport').click();
  }
});

document.getElementById('fileImport').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try {
      var data = JSON.parse(ev.target.result);
      if(Array.isArray(data.reservas)) reservas = data.reservas;
      if(Array.isArray(data.suites)) suites = data.suites;
      save();
      render();
      alert('Dados importados com sucesso!');
    } catch(err){
      alert('Erro ao importar: ' + err.message);
    }
  };
  reader.readAsText(file);
});

loadData(function(){ render(); });
</script>
</body>
</html>
